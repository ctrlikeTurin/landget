# Render Blueprint: New → Blueprint → pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: landlink
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL          # Supabase pooler URI (port 6543)
        sync: false
      - key: SUPABASE_URL          # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY    # optional; leave empty for the rule-based assistant
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: APP_URL
        sync: false
