# Render's free tier sleeps after 15 idle minutes, and waking takes 30-60s.
# Pinging the health check every 10 minutes keeps it warm (free on public repos).
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping LandLink
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://landlink-tzt7.onrender.com/api/health
